<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiLoSeNoSalgo</title>
    <meta name="description" content="Previsión meteorológica a lo largo de tu ruta GPX, hora a hora." />

    <!-- Open Graph / Twitter — previa al pegar el enlace en WhatsApp, Telegram, etc.
         Para enlaces compartidos (/?s=<id>) el middleware del edge sobrescribe
         og:title / og:description con el nombre de la salida, y og:image / og:url
         con URLs absolutas. Estos valores son los de marca por defecto (home). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SiLoSeNoSalgo" />
    <meta property="og:title" content="SiLoSeNoSalgo" />
    <meta property="og:description" content="Previsión meteorológica a lo largo de tu ruta GPX, hora a hora." />
    <meta property="og:image" content="/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SiLoSeNoSalgo" />
    <meta name="twitter:description" content="Previsión meteorológica a lo largo de tu ruta GPX, hora a hora." />
    <meta name="twitter:image" content="/og-card.png" />
    <!-- El arranque con la marca, igual que CargandoMarca: se ve desde el primer
         pintado, antes de que llegue el código, y React lo sustituye al montar.
         Estilos a mano porque la hoja de estilos puede no haber llegado aún. -->
    <style>
      html, body { margin: 0; background: #020617; }
      @keyframes arranque-latido { 50% { opacity: 0.5; } }
      .arranque { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #020617; background: oklch(12.9% 0.042 264.695); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; text-align: center; }
      .arranque svg { animation: arranque-latido 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      .arranque-nombre { margin: 0; font-size: 18px; line-height: 28px; font-weight: 700; letter-spacing: -0.025em; color: #38bdf8; color: oklch(74.6% 0.16 232.661); }
      .arranque-texto { margin: 4px 0 0; font-size: 12px; line-height: 16px; color: #64748b; color: oklch(55.4% 0.046 257.417); }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- El logo es copia de public/favicon.svg. -->
      <div class="arranque" role="status" aria-live="polite">
        <svg width="72" height="72" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="130.3 130.3 763.4 763.4"><defs>
<linearGradient id="fondo" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#2A1650"/><stop offset=".55" stop-color="#150A2E"/><stop offset="1" stop-color="#07030F"/></linearGradient>
<radialGradient id="brillo" cx=".28" cy=".12" r=".75"><stop offset="0" stop-color="#8A55FF" stop-opacity="0.32"/><stop offset="1" stop-color="#8A55FF" stop-opacity="0"/></radialGradient>
<linearGradient id="cuerpo" x1="0" y1="0" x2=".25" y2="1"><stop offset="0" stop-color="#E4D7FF" stop-opacity="0.98"/><stop offset="1" stop-color="#9C68FF" stop-opacity="0.95"/></linearGradient>
<linearGradient id="acento" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCCBFF"/></linearGradient>
<radialGradient id="especular" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="sombra" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="18"/><feOffset dy="20"/></filter>
<filter id="vidrio" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
<feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/><feOffset in="b" dy="7" result="bo"/><feComposite in="SourceAlpha" in2="bo" operator="out" result="arriba"/>
<feFlood flood-color="#fff" flood-opacity=".95"/><feComposite in2="arriba" operator="in" result="luz"/>
<feOffset in="b" dy="-10" result="bu"/><feComposite in="SourceAlpha" in2="bu" operator="out" result="abajo"/>
<feFlood flood-color="#3A0FA0" flood-opacity=".38"/><feComposite in2="abajo" operator="in" result="sombreado"/>
<feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sombreado"/><feMergeNode in="luz"/></feMerge></filter>
<mask id="m-trazo" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><path d="M643.9 237.9L395.5 513.3L629.5 513.3L404.5 761.7" fill="none" stroke="#fff" stroke-width="93.6" stroke-linecap="round" stroke-linejoin="round"/></mask><mask id="m-punto" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><circle cx="404.5" cy="761.7" r="71.1" fill="#fff"/></mask>
</defs><circle cx="404.5" cy="761.7" r="124" fill="#B393FF" opacity="0.23"/><g filter="url(#vidrio)"><path d="M643.9 237.9L395.5 513.3L629.5 513.3L404.5 761.7" fill="none" stroke="url(#cuerpo)" stroke-width="93.6" stroke-linecap="round" stroke-linejoin="round"/></g><g mask="url(#m-trazo)"><ellipse cx="520" cy="330" rx="200" ry="64" transform="rotate(-48 520 330)" fill="url(#especular)"/></g><circle cx="643.9" cy="237.9" r="20.6" fill="url(#acento)" opacity=".55"/><g filter="url(#vidrio)"><circle cx="404.5" cy="761.7" r="71.1" fill="url(#acento)"/></g><g mask="url(#m-punto)"><ellipse cx="382.5" cy="731.7" rx="48" ry="28" transform="rotate(-20 382.5 731.7)" fill="url(#especular)"/></g><circle cx="404.5" cy="761.7" r="25.3" fill="#5A1BE0"/></svg>
        <div>
          <p class="arranque-nombre">SiLoSeNoSalgo</p>
          <p class="arranque-texto">Cargando…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
