<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiLoSeNoSalgo</title>
    <meta name="description" content="Previsión meteorológica a lo largo de tu ruta GPX, hora a hora." />

    <!-- Open Graph / Twitter — previa al pegar el enlace en WhatsApp, Telegram, etc.
         Para enlaces compartidos (/?s=<id>) el middleware del edge sobrescribe
         og:title / og:description con el nombre de la salida, y og:image / og:url
         con URLs absolutas. Estos valores son los de marca por defecto (home). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SiLoSeNoSalgo" />
    <meta property="og:title" content="SiLoSeNoSalgo" />
    <meta property="og:description" content="Previsión meteorológica a lo largo de tu ruta GPX, hora a hora." />
    <meta property="og:image" content="/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SiLoSeNoSalgo" />
    <meta name="twitter:description" content="Previsión meteorológica a lo largo de tu ruta GPX, hora a hora." />
    <meta name="twitter:image" content="/og-card.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
