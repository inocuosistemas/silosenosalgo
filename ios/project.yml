name: SiLoSeNoSalgoTracker
options:
  # Dominio inverso de la empresa, el MISMO que el `applicationId` de Android
  # (`android/app/build.gradle.kts`). Sale de themakercrowd.com, que es el
  # dominio desde el que se publica el visor; el anterior `app.silosenosalgo`
  # venía de un dominio que no es nuestro. Una vez publicada la app en la App
  # Store este identificador ya no se puede cambiar.
  # Ver ../docs/firma-y-publicacion.md
  bundleIdPrefix: com.themakercrowd
  deploymentTarget:
    # 17.0: el widget de la cuenta atrás se configura con AppIntents (mantener
    # pulsado ▸ elegir la carrera), que es de iOS 17. Antes el mínimo era 16.4
    # por el visor incrustado (DecompressionStream en WKWebView).
    #
    # Lo que deja fuera: iPhone 8, 8 Plus y X, que no pasan de iOS 16. Del XR y
    # del XS en adelante, todos.
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # El equipo de la ORGANIZACIÓN (Inocuo Sistemas Informáticos SL). Va aquí
    # para que XcodeGen no lo pierda al regenerar el proyecto. Se puede pisar
    # desde fuera con la variable de entorno DEVELOPMENT_TEAM (p. ej. para
    # firmar con el certificado personal gratuito).
    # Ver ../docs/firma-y-publicacion.md
    DEVELOPMENT_TEAM: "3M9984SP6R"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
targets:
  SiLoSeNoSalgoTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # `Sources` entero MENOS lo del widget: ese código va en su objetivo, y
      # `Sources/Compartido` va en los dos (el contador lo escribe la app y lo
      # lee el widget).
      - path: Sources
        excludes:
          - "Widget/**"
      # Built web viewer (from repo-root `dist/`, copied by scripts/copy-webdist.sh).
      # A folder reference preserves the /assets/ layout the SPA loads by absolute path.
      - path: WebDist
        type: folder
        buildPhase: resources
      # El icono, generado desde el favicon del visor por scripts/genera-icono.mjs.
      - path: Resources/Assets.xcassets
      # Manifiesto de privacidad: sin él la subida a TestFlight avisa (ITMS-91053).
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: ZIPFoundation
      # El widget viaja DENTRO de la app: es una extensión, no otra app.
      - target: SiLoSeNoSalgoWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.themakercrowd.silosenosalgo
        # El nombre bajo el icono. Va por variable —y no escrito en el
        # Info.plist— para poder distinguir en la pantalla de inicio la copia
        # de desarrollo de la de TestFlight.
        APP_DISPLAY_NAME: SiLoSeNoSalgo - Baliza
        PRODUCT_NAME: SiLoSeNoSalgo
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # La copia de desarrollo es OTRA app para iOS, que identifica cada una
        # por su bundle id. Sin esto, instalar desde Xcode pisaba la de
        # TestFlight y la siguiente subida pisaba la de desarrollo: nunca se
        # podían tener las dos para comparar. Es el mismo apaño que Android ya
        # hacía con `applicationIdSuffix = ".debug"`.
        #
        # No hace falta dar de alta este App ID: nunca va a la tienda, y para
        # instalar por cable Xcode se apaña con el comodín (ver 60d4bf6). Se
        # cambia SOLO el identificador y el nombre visible, no PRODUCT_NAME:
        # las pruebas corren en Debug y su TEST_HOST lleva escrito el nombre
        # del ejecutable.
        #
        # Ojo: son apps distintas, así que la de desarrollo no hereda la sesión
        # —el llavero va por app—, ni las trazas, ni las teselas descargadas.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.themakercrowd.silosenosalgo.debug
          APP_DISPLAY_NAME: SiLoSeNoSalgo dev
          # El cajón compartido, también aquí: sin él el widget de esta copia
          # sale vacío y no se puede probar sin pasar por TestFlight. Lo crea
          # el firmado automático con la cuenta de Xcode puesta.
          CODE_SIGN_ENTITLEMENTS: Resources/Debug.entitlements
          # Aquí NO va el permiso de push, a propósito: esta copia usa el bundle
          # id `.debug`, que no está dado de alta en el portal y se firma con el
          # perfil COMODÍN, y un App ID comodín no admite push. Poniéndoselo, la
          # instalación por cable dejaba de firmar ("doesn't include the
          # aps-environment entitlement").
          #
          # La consecuencia, dicha claramente: la copia de desarrollo NO recibe
          # push. Se prueba con la de TestFlight. Para tenerlo también por cable
          # habría que dar de alta `com.themakercrowd.silosenosalgo.debug` con
          # push en el portal.
        Release:
          # La que se reparte sí, con `aps-environment: production`: los tokens
          # de TestFlight son de producción.
          CODE_SIGN_ENTITLEMENTS: Resources/Release.entitlements
  # El widget de la cuenta atrás. Otro objetivo porque es otro proceso: el
  # sistema lo despierta cuando le toca pintar, sin abrir la app.
  SiLoSeNoSalgoWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Widget
      - path: Sources/Compartido
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.themakercrowd.silosenosalgo.contador
        # El nombre con el que sale en la galería de widgets. Va por variable
        # por lo mismo que el de la app: con las dos copias instaladas, la
        # galería enseñaba dos «SiLoSeNoSalgo» idénticos y no había forma de
        # saber cuál se estaba añadiendo.
        WIDGET_DISPLAY_NAME: SiLoSeNoSalgo
        PRODUCT_NAME: SiLoSeNoSalgoWidget
        INFOPLIST_FILE: Resources/Widget-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ""
        CODE_SIGN_ENTITLEMENTS: Resources/Widget.entitlements
      configs:
        Debug:
          # Igual que la app: otro identificador para no pisar la de TestFlight,
          # y el mismo cajón compartido, que es de lo que vive el widget.
          PRODUCT_BUNDLE_IDENTIFIER: com.themakercrowd.silosenosalgo.debug.contador
          WIDGET_DISPLAY_NAME: SiLoSeNoSalgo dev
          CODE_SIGN_ENTITLEMENTS: Resources/Debug.entitlements

  SiLoSeNoSalgoTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: SiLoSeNoSalgoTracker
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SiLoSeNoSalgo.app/SiLoSeNoSalgo"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SiLoSeNoSalgoTracker:
    build:
      targets:
        SiLoSeNoSalgoTracker: all
        SiLoSeNoSalgoTrackerTests: [test]
    test:
      targets:
        - SiLoSeNoSalgoTrackerTests
