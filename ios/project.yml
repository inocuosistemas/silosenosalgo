name: SiLoSeNoSalgoTracker
options:
  bundleIdPrefix: app.silosenosalgo
  deploymentTarget:
    # 16.4: the embedded viewer gunzips the plan overlay with DecompressionStream,
    # which WKWebView only ships from iOS 16.4+.
    iOS: "16.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
targets:
  SiLoSeNoSalgoTracker:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: Sources
      # Built web viewer (from repo-root `dist/`, copied by scripts/copy-webdist.sh).
      # A folder reference preserves the /assets/ layout the SPA loads by absolute path.
      - path: WebDist
        type: folder
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.silosenosalgo.tracker
        PRODUCT_NAME: SiLoSeNoSalgo
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  SiLoSeNoSalgoTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: Tests
    dependencies:
      - target: SiLoSeNoSalgoTracker
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SiLoSeNoSalgo.app/SiLoSeNoSalgo"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SiLoSeNoSalgoTracker:
    build:
      targets:
        SiLoSeNoSalgoTracker: all
        SiLoSeNoSalgoTrackerTests: [test]
    test:
      targets:
        - SiLoSeNoSalgoTrackerTests
