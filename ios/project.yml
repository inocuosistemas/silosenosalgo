name: SiLoSeNoSalgoTracker
options:
  # Dominio inverso de la empresa, el MISMO que el `applicationId` de Android
  # (`android/app/build.gradle.kts`). Sale de themakercrowd.com, que es el
  # dominio desde el que se publica el visor; el anterior `app.silosenosalgo`
  # venía de un dominio que no es nuestro. Una vez publicada la app en la App
  # Store este identificador ya no se puede cambiar.
  # Ver ../docs/firma-y-publicacion.md
  bundleIdPrefix: com.themakercrowd
  deploymentTarget:
    # 16.4: the embedded viewer gunzips the plan overlay with DecompressionStream,
    # which WKWebView only ships from iOS 16.4+.
    iOS: "16.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # El equipo de la ORGANIZACIÓN (Inocuo Sistemas Informáticos SL). Va aquí
    # para que XcodeGen no lo pierda al regenerar el proyecto. Se puede pisar
    # desde fuera con la variable de entorno DEVELOPMENT_TEAM (p. ej. para
    # firmar con el certificado personal gratuito).
    # Ver ../docs/firma-y-publicacion.md
    DEVELOPMENT_TEAM: "3M9984SP6R"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
targets:
  SiLoSeNoSalgoTracker:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: Sources
      # Built web viewer (from repo-root `dist/`, copied by scripts/copy-webdist.sh).
      # A folder reference preserves the /assets/ layout the SPA loads by absolute path.
      - path: WebDist
        type: folder
        buildPhase: resources
      # El icono, generado desde el favicon del visor por scripts/genera-icono.mjs.
      - path: Resources/Assets.xcassets
      # Manifiesto de privacidad: sin él la subida a TestFlight avisa (ITMS-91053).
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.themakercrowd.silosenosalgo
        # El nombre bajo el icono. Va por variable —y no escrito en el
        # Info.plist— para poder distinguir en la pantalla de inicio la copia
        # de desarrollo de la de TestFlight.
        APP_DISPLAY_NAME: SiLoSeNoSalgo - Baliza
        PRODUCT_NAME: SiLoSeNoSalgo
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # La copia de desarrollo es OTRA app para iOS, que identifica cada una
        # por su bundle id. Sin esto, instalar desde Xcode pisaba la de
        # TestFlight y la siguiente subida pisaba la de desarrollo: nunca se
        # podían tener las dos para comparar. Es el mismo apaño que Android ya
        # hacía con `applicationIdSuffix = ".debug"`.
        #
        # No hace falta dar de alta este App ID: nunca va a la tienda, y para
        # instalar por cable Xcode se apaña con el comodín (ver 60d4bf6). Se
        # cambia SOLO el identificador y el nombre visible, no PRODUCT_NAME:
        # las pruebas corren en Debug y su TEST_HOST lleva escrito el nombre
        # del ejecutable.
        #
        # Ojo: son apps distintas, así que la de desarrollo no hereda la sesión
        # —el llavero va por app—, ni las trazas, ni las teselas descargadas.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.themakercrowd.silosenosalgo.debug
          APP_DISPLAY_NAME: SiLoSeNoSalgo dev
  SiLoSeNoSalgoTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: Tests
    dependencies:
      - target: SiLoSeNoSalgoTracker
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SiLoSeNoSalgo.app/SiLoSeNoSalgo"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SiLoSeNoSalgoTracker:
    build:
      targets:
        SiLoSeNoSalgoTracker: all
        SiLoSeNoSalgoTrackerTests: [test]
    test:
      targets:
        - SiLoSeNoSalgoTrackerTests
